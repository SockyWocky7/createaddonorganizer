name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: chmod +x ./gradlew
      - run: ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/*.jar
          archive: false
